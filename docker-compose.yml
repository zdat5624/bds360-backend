version: '3.8'

services:
  # ==========================================
  # 1. DATABASE TẬP TRUNG
  # ==========================================
  mysql-db:
    image: mysql:8.0
    container_name: bds360_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Ánh xạ thư mục chứa init.sql vào thư mục khởi tạo tự động của MySQL
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    # FIX 1: Bỏ command cũ, MySQL 8.0 mặc định dùng caching_sha2_password, Java 21 hỗ trợ hoàn toàn
    # command: --default-authentication-plugin=mysql_native_password
    # FIX 2: Sửa lại lệnh Healthcheck chuẩn để nó dùng password ping vào db
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      timeout: 10s
      retries: 10
      start_period: 20s

  # ==========================================
  # 2. NESTJS SERVICES (Node.js) - Hot Reload
  # ==========================================
  media-service:
    image: node:20-alpine
    container_name: bds360_media
    working_dir: /app
    ports:
      - "3001:3001"
    volumes:
      - ./media-service:/app
      - /app/node_modules # Cách ly node_modules khỏi Windows
    command: sh -c "npm install && npm run start:dev"

  notification-service:
    image: node:20-alpine
    container_name: bds360_notification
    working_dir: /app
    ports:
      - "3002:3002"
      - "9093:9093" # Port gRPC cho Spring Boot gọi qua
    volumes:
      - ./notification-service:/app
      - /app/node_modules
    command: sh -c "npm install && npm run start:dev"

  # ==========================================
  # 3. .NET SERVICE (C#) - Hot Reload (dotnet watch)
  # ==========================================
  statistic-service:
    image: mcr.microsoft.com/dotnet/sdk:9.0 # Dùng SDK để có tính năng Watch
    container_name: bds360_statistic
    working_dir: /app
    ports:
      - "5001:5001"
    volumes:
      - ./statistic-service:/app
    environment:
      # Bắt buộc để File Watcher của .NET hoạt động ổn định trong Docker
      - DOTNET_USE_POLLING_FILE_WATCHER=true 
      - ASPNETCORE_ENVIRONMENT=Development
    command: dotnet watch run --urls "http://0.0.0.0:5001"

  # ==========================================
  # 4. SPRING BOOT SERVICES (Java) - Hot Reload (gradlew -t)
  # ==========================================
  api-gateway:
    image: eclipse-temurin:21-jdk-alpine
    container_name: bds360_gateway
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./api-gateway:/app
      - gateway_cache:/root/.gradle
    command: ./gradlew bootRun -t

  identity-service:
    image: eclipse-temurin:21-jdk-alpine
    container_name: bds360_identity
    working_dir: /app
    ports:
      - "8081:8081"
    volumes:
      - ./identity-service:/app
      - identity_cache:/root/.gradle
    environment:
      # FIX 3: Rút gọn DB_URL, loại bỏ cờ dư thừa, đẩy việc chờ đợi cho depends_on
      - DB_URL=jdbc:mysql://mysql-db:3306/bds360_identity_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    command: sh -c './gradlew -t classes & ./gradlew bootRun'
    depends_on:
      mysql-db:
        condition: service_healthy

  listing-service:
    image: eclipse-temurin:21-jdk-alpine
    container_name: bds360_listing
    working_dir: /app
    ports:
      - "8082:8082"
    volumes:
      - ./listing-service:/app
      - listing_cache:/root/.gradle
    environment:
      - DB_URL=jdbc:mysql://mysql-db:3306/bds360_listing_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    command: ./gradlew bootRun -t
    depends_on:
      mysql-db:
        condition: service_healthy

  payment-service:
    image: eclipse-temurin:21-jdk-alpine
    container_name: bds360_payment
    working_dir: /app
    ports:
      - "8083:8083"
    volumes:
      - ./payment-service:/app
      - payment_cache:/root/.gradle
    environment:
      - DB_URL=jdbc:mysql://mysql-db:3306/bds360_payment_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    command: ./gradlew bootRun -t
    depends_on:
      mysql-db:
        condition: service_healthy

# ==========================================
# KHAI BÁO VOLUMES DÙNG CHUNG
# ==========================================
volumes:
  mysql_data:
  gateway_cache:
  identity_cache:
  listing_cache:
  payment_cache: