server:
  port: 8080 # Cửa chính

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Cấu hình CORS tập trung để Next.js không bị lỗi chặn viền
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*" # Có thể đổi thành "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"

      # BẢN ĐỒ ĐỊNH TUYẾN
      routes:
        # 1. Đi vào Identity Service
        - id: identity-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**

        # 2. Đi vào Listing Service
        - id: listing-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/posts/**, /api/v1/categories/**

        # 3. Đi vào Payment Service
        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/payments/**, /api/v1/transactions/**

        # 4. Đi vào Media Service (NestJS)
        - id: media-service
          uri: http://localhost:3001
          predicates:
            - Path=/api/v1/media/**

        # 5. Đi vào Notification Service (NestJS)
        - id: notification-service
          uri: http://localhost:3002
          predicates:
            - Path=/api/v1/notifications/**

        # 6. Đi vào Statistic Service (.NET)
        - id: statistic-service
          uri: http://statistic-service:5001
          predicates:
            - Path=/api/v1/statistics/**