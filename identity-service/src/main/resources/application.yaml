server:
  port: 8081

spring:
  main:
      lazy-initialization: true
  application:
    name: identity-service
  datasource:
    # Cú pháp ${TÊN_BIẾN:Giá_trị_mặc_định}
    url: ${DB_URL:jdbc:mysql://localhost:3307/bds360_identity_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s

grpc:
  server:
    port: 9091

#./gradlew compileJava -t --build-cache --parallel
