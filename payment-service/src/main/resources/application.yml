server:
  port: 8083

spring:
  application:
    name: payment-service
  main:
    lazy-initialization: true
  devtools:
    restart:
      enabled: true
      poll-interval: 500ms
      quiet-period: 300ms
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/bds360_payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

grpc:
  server:
    port: 9094

api:
  jwt:
    base64-secret: ***REMOVED***
    token-validity-in-seconds: 3600000

vnp:
  tmn-code: ${VNP_TMN_CODE:87U46G89}
  secret-key: ${VNP_SECRET_KEY:VCFPST44XXTNDK11SOPGNS6X6GAKO99I}
  pay-url: ${VNP_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url-backend: ${VNP_RETURN_URL_BACKEND:http://localhost:8080/api/v1/payments/vnpay-return}
  return-url-frontend: ${VNP_RETURN_URL_FRONTEND:http://localhost:3000/payment-success}
